[project]
name = "total-loss-investigator"
version = "0.1.0"
description = "Local step-through claims investigation desk"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0,<2",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "pymupdf>=1.25,<3",
    "pytesseract>=0.3.13",
    "pillow>=10",
    "python-dotenv>=1",
    "opik>=2,<3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
